name: Reminder Cron Fallback

on:
  schedule:
    # Berjalan setiap hari pukul 01:00 UTC (08:00 WIB)
    - cron: "0 1 * * *"
  # Memungkinkan pemicu manual kapan saja via tombol di tab GitHub Actions
  workflow_dispatch:

jobs:
  send-reminders:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Reminder Cron Endpoint
        run: |
          curl -f -s -S -X POST "${{ secrets.APP_URL }}/api/cron/reminders" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"

      - name: Trigger Weekly Digest on Mondays
        run: |
          # Jalankan hanya jika hari ini hari Senin (1)
          if [ "$(date +%u)" = "1" ]; then
            echo "Hari Senin terdeteksi. Memproses Smart Weekly Digest..."
            curl -f -s -S -X POST "${{ secrets.APP_URL }}/api/cron/digest" \
              -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
          else
            echo "Bukan hari Senin, lewati digest."
          fi